name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Plain shell steps only: this repo's Actions policy allows no third-party actions
# (not even actions/checkout), so checkout, Node setup and the Sonar scan are done by hand.
jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          # Full history: Sonar needs it for blame and new-code detection.
          git clone --no-checkout "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          git fetch origin "${GITHUB_SHA}"
          git checkout --force "${GITHUB_SHA}"

      - name: Use the Node version from .nvmrc
        run: |
          version=$(curl -fsSL https://nodejs.org/dist/index.json | jq -r --arg m "v$(cat .nvmrc)." '[.[] | select(.version | startswith($m))][0].version')
          curl -fsSL "https://nodejs.org/dist/${version}/node-${version}-linux-x64.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-${version}-linux-x64/bin" >> "$GITHUB_PATH"

      - run: node --version && corepack enable && yarn --version
      - run: yarn install --frozen-lockfile

      - run: yarn lint
      - run: yarn typecheck
      - name: Test with coverage (fails under the thresholds)
        run: yarn test:coverage
      - run: yarn build
        env:
          VITE_SITE_URL: https://example.com

      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          # Make coverage paths repo-relative so Sonar can match them to files.
          sed -i 's#^SF:#SF:apps/client/#' apps/client/coverage/lcov.info
          sed -i 's#^SF:#SF:apps/server/#' apps/server/coverage/lcov.info
          sed -i 's#^SF:#SF:packages/shared/#' packages/shared/coverage/lcov.info
          npx --yes @sonar/scan -Dsonar.host.url=https://sonarcloud.io
