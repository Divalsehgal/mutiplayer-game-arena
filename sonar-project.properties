# SonarCloud / SonarQube config. Check projectKey and organization match your
# SonarCloud project (SonarCloud's default key is <org>_<repo>).
sonar.projectKey=Divalsehgal_mutiplayer-game-arena
sonar.organization=divalsehgal
sonar.projectName=Game Arena

sonar.sources=apps/client/src,apps/server/src,apps/server/server.ts,packages/shared/src
sonar.tests=apps/client/src,apps/server/src,packages/shared/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/test.ts,**/test.tsx,apps/client/src/test/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
sonar.coverage.exclusions=apps/client/src/main.tsx,apps/client/src/vite-env.d.ts,apps/server/src/models/index.ts,packages/shared/src/index.ts,apps/client/src/test/**

# CI rewrites each report's paths to be repo-relative before the scan (see .github/workflows/ci.yml).
sonar.javascript.lcov.reportPaths=apps/client/coverage/lcov.info,apps/server/coverage/lcov.info,packages/shared/coverage/lcov.info
sonar.sourceEncoding=UTF-8
